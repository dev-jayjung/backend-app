server:
  port: 8080

spring:
  application:
    name: web-admin
  profiles:
    active: local
  config:
    import:
      - optional:classpath:application-web-admin.yml
  devtools:
    restart:
      additional-paths:
      - ../cores/build/classes/java/main
      enabled: true


logging:
  config: classpath:logback-spring.xml